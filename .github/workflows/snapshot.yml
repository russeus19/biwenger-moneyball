name: Snapshot diario

# Seis pases al día. Los horarios van en UTC; entre paréntesis, la hora
# peninsular de verano.
#
# Dos avisos sobre los crons de GitHub:
#   - Se retrasan, y a veces se saltan, cuando la hora en punto está
#     congestionada. Por eso el minuto es 47 y no 00 ni 15.
#   - En el plan gratuito no hay garantía de puntualidad. Varios pases al día
#     son también un seguro: si uno se pierde, el siguiente lo cubre.
#
# LA HORA CLAVE son las 05:00 UTC (07:00 peninsular en verano): es cuando se
# resuelven las subastas y se ejecutan los traspasos. No es una suposición: sale
# del campo `until` del mercado real, que cae clavado en esa hora en punto.
# Todo lo demás se ordena alrededor de ese momento.
on:
  schedule:
    - cron: '0 23 * * *'      # 01:00 · primera hora
    - cron: '35 1 * * *'      # 03:35 · madrugada
    - cron: '35 4 * * *'      # 06:35 · antes del cierre de subastas
    - cron: '35 5 * * *'      # 07:35 · TRAS los traspasos: mercado y plantilla nuevos
    - cron: '35 6 * * *'      # 08:35 · segunda pasada tras los traspasos
    - cron: '35 7 * * *'      # 09:35 · media mañana
    - cron: '47 9 * * *'      # 11:47 · mediodía
    - cron: '47 17 * * *'     # 19:47 · tarde
    - cron: '47 20 * * *'     # 22:47 · noche
    - cron: '57 21 * * *'     # 23:57 · tras las jornadas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    # Una ejecución por manager. Las recomendaciones dependen de la plantilla y
    # del saldo de cada uno, así que el mismo mercado da resultados distintos.
    # Para añadir a alguien: una entrada más aquí y sus dos secretos.
    strategy:
      fail-fast: false
      matrix:
        manager:
          - { slug: dani, email_secret: DANI_EMAIL, pass_secret: DANI_PASSWORD }
          - { slug: ana,  email_secret: ANA_EMAIL,  pass_secret: ANA_PASSWORD }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` exige package-lock.json. Si no está en el repositorio, falla
      # al instante con un mensaje que no dice gran cosa, así que se recurre a
      # `npm install` en ese caso.
      - name: Instalar
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "Sin package-lock.json: usando npm install"
            npm install --no-audit --no-fund
          fi

      - name: Comprobar credenciales
        env:
          EMAIL: ${{ secrets[matrix.manager.email_secret] }}
          PASS: ${{ secrets[matrix.manager.pass_secret] }}
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASS" ]; then
            echo "Faltan los secretos ${{ matrix.manager.email_secret }} y/o ${{ matrix.manager.pass_secret }}."
            echo "Créalos en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Credenciales de ${{ matrix.manager.slug }} presentes."

      - name: Snapshot de ${{ matrix.manager.slug }}
        env:
          BIWENGER_EMAIL: ${{ secrets[matrix.manager.email_secret] }}
          BIWENGER_PASSWORD: ${{ secrets[matrix.manager.pass_secret] }}
          BIWENGER_LEAGUE: ${{ secrets.BIWENGER_LEAGUE }}
          BIWENGER_BID_MODE: ${{ secrets.BIWENGER_BID_MODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Base separada por manager: comparten mercado pero no plantilla.
          DB_PATH: ./data/${{ matrix.manager.slug }}.db
          MANAGER_SLUG: ${{ matrix.manager.slug }}
        run: npm run snapshot

      # Los trabajos de la matriz corren en paralelo y chocarían al hacer push,
      # así que cada uno sube su fichero y el job de abajo los junta.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salida-${{ matrix.manager.slug }}
          path: |
            data/market-*.json
            data/*.db
          if-no-files-found: ignore

  publicar:
    needs: snapshot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./descargas
        continue-on-error: true

      - name: Consolidar y publicar
        env:
          # La base de datos solo se guarda en el pase de después de los traspasos,
          # que es el estado canónico del día.
          #
          # Es un fichero binario: Git no puede guardar diferencias, así que
          # cada commit almacena una copia entera. Con seis pases diarios el
          # repositorio se hincharía a ojos vista. Y no se pierde nada, porque
          # las filas van por fecha y los pases del mismo día reescriben las
          # mismas: los precios de Biwenger solo cambian de madrugada.
          GUARDAR_DB: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '35 5 * * *' }}
        run: |
          mkdir -p data
          encontrados=0
          if [ -d ./descargas ]; then
            for f in $(find ./descargas -type f -name '*.json'); do
              cp "$f" data/
              encontrados=$((encontrados+1))
            done
            if [ "$GUARDAR_DB" = "true" ]; then
              for f in $(find ./descargas -type f -name '*.db'); do
                cp "$f" data/
              done
              echo "Pase posterior a los traspasos: se guarda el histórico."
            else
              echo "Pase intermedio: solo los JSON, sin tocar el histórico."
            fi
          fi
          echo "$encontrados fichero(s) de datos recogidos"

          if [ "$encontrados" -eq 0 ]; then
            echo "Ningún manager produjo datos. Mira los errores de los jobs de arriba."
            exit 0
          fi

          git config user.name "snapshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/market-*.json 2>/dev/null || true
          if [ "$GUARDAR_DB" = "true" ]; then
            git add -f data/*.db 2>/dev/null || true
          fi
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar: el mercado no se ha movido."
          else
            git commit -m "snapshot $(date -u +'%F %H:%M') UTC"
            git push
          fi
